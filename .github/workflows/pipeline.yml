name: CI/CD Pipeline

on: pull_request: branches: - main push: branches: - main

permissions: contents: read packages: write

env: REGISTRY: ghcr.io IMAGE_NAME: ${{ github.repository }}

jobs: test: name: Build and test Docker image runs-on: ubuntu-latest

steps: - name: Checkout repository uses: actions/checkout@v4

- name: Set up Docker Buildx uses: docker/setup-buildx-action@v3

- name: Build Docker image uses: docker/build-push-action@v6 with: context: . load: true tags: test-image:${{ github.sha }}

- name: Run test container run: docker run --rm test-image:${{ github.sha }}

publish: name: Publish Docker image runs-on: ubuntu-latest needs: test if: github.event_name == 'push' && github.ref == 'refs/heads/main'

steps: - name: Checkout repository uses: actions/checkout@v4

- name: Set up Docker Buildx uses: docker/setup-buildx-action@v3

- name: Log in to GitHub Container Registry uses: docker/login-action@v3 with: registry: ${{ env.REGISTRY }} username: ${{ github.actor }} password: ${{ secrets.GITHUB_TOKEN }}

- name: Build and push Docker image uses: docker/build-push-action@v6 with: context: . push: true tags: 
